# Move away from command, use module instead.
- name: Ensure required PostgreSQL extensions
  ansible.builtin.command:
    argv:
      - /opt/gitlab/embedded/bin/psql
      - -h
      - "{{ db_endpoint }}"
      - -U
      - "{{ db_user }}"
      - -d
      - "{{ db_name }}"
      - -c
      - "CREATE EXTENSION IF NOT EXISTS {{ item }};"
  environment:
    PGPASSWORD: "{{ db_password }}"
  loop:
    - btree_gist
    - pg_trgm
  register: postgresql_extensions
  changed_when: true
  # changed_when: >
  #   postgresql_extensions
  #   | selectattr('stderr', 'equalto', '')
  #   | list
  #   | length > 0

- name: Print postgres migration output
  ansible.builtin.debug:
    msg: " Out: {{ item }}"
  loop: "{{ postgresql_extensions.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Reconfigure GitLab
  ansible.builtin.command: gitlab-ctl reconfigure
  changed_when: true
  become: true

- name: Check GitLab Rake
  ansible.builtin.command: gitlab-rake gitlab:check
  changed_when: false
  register: gitlab_rake_check
  become: true

- name: Print Gitlab Rake Check
  ansible.builtin.debug:
    msg: "{{ gitlab_rake_check.stdout_lines }}"


# Correct flow should be configure IAM for host and bucket
- name: Fetch Gitlab secrets to local host
  ansible.builtin.fetch:
    src: /etc/gitlab/gitlab-secrets.json
    dest: "./tmp/"
    flat: true
  become: true
  run_once: true

# Should upload directly from host
- name: Upload to S3 securely
  amazon.aws.s3_object:
    bucket: ansible-ssm-bucket-gnaig
    object: gitlab/gitlab-secrets.json
    src: tmp/gitlab-secrets.json
    mode: put
  run_once: true
  delegate_to: localhost
