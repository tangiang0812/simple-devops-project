- name: Fetch all parameters in one call
  ansible.builtin.set_fact:
    gitlab_params: "{{ lookup('amazon.aws.aws_ssm', '/gitlab', bypath=true, region=aws_region, recursive=True, decrypt=True) }}"

- name: Parse params in to separate vars
  ansible.builtin.set_fact:
    db_password: "{{ gitlab_params['/gitlab/postgresql/db_password'] }}"
    db_user: "{{ gitlab_params['/gitlab/postgresql/db_user'] }}"
    db_name: "{{ gitlab_params['/gitlab/postgresql/db_name'] }}"
    db_endpoint: "{{ gitlab_params['/gitlab/postgresql/db_endpoint'] }}"
    redis_endpoint: "{{ gitlab_params['/gitlab/redis/cache_endpoint'] }}"
    domain_name: "{{ gitlab_params['/gitlab/domain_name'] }}"
    rails_password: "{{ gitlab_params['/gitlab/rails/rails_password'] }}"
    gitaly_token: "{{ gitlab_params['/gitlab/gitaly/gitaly_token'] }}"

- name: Backup gitlab.rb
  ansible.builtin.copy:
    src: /etc/gitlab/gitlab.rb
    dest: /etc/gitlab/gitlab.rb.bak
    mode: "0600"
    remote_src: true
  become: true
  when: not ansible_check_mode

- name: Configure gitlab.rb
  ansible.builtin.template:
    src: gitlab-rails.rb.j2
    dest: /etc/gitlab/gitlab.rb
    owner: root
    group: root
    mode: "0600"
  become: true

