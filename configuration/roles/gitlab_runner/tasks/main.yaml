# - name: Wait for user confirmation
#   ansible.builtin.pause:
#     prompt: "Check, update GITLAB_ROOT_TOKEN env var"

- name: Get git root
  ansible.builtin.command: git rev-parse --show-toplevel
  changed_when: false
  register: git_root
  delegate_to: localhost

- name: Load Gitlab root token env var
  ansible.builtin.set_fact:
    gitlab_root_token: "{{ lookup('ansible.builtin.env', 'GITLAB_ROOT_TOKEN') }}"
  delegate_to: localhost

# - name: Debug gitlab
#   ansible.builtin.debug:
#     msg: "Gitlab root token: {{ gitlab_root_token }}"

- name: Set Gitlab runner auth token
  community.aws.ssm_parameter:
    name: "/gitlab/runner/gitlab_access_token"
    string_type: SecureString
    value: "{{ gitlab_root_token }}"
    region: "{{ aws_region }}"
    state: present
    tags:
      Environment: "production"
      Project: "gitlab"
      Name: "gitlab-access-token"
    overwrite_value: "always"
  delegate_to: localhost
  run_once: true

