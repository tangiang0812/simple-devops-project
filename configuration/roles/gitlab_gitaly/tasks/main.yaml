# Correct flow should be configure IAM for host and bucket
- name: Download from S3 securely
  amazon.aws.s3_object:
    bucket: ansible-ssm-bucket-gnaig
    object: gitlab/gitlab-secrets.json
    dest: tmp/gitlab-secrets.json
    mode: get
  run_once: true
  delegate_to: localhost

# Should download directly to host
- name: Copy Gitlab secrets from localhost to Gitlab gitaly.
  ansible.builtin.copy:
    src: tmp/gitlab-secrets.json
    dest: /etc/gitlab/gitlab-secrets.json
    mode: '0600'
  become: true

- name: Fetch all parameters in one call
  ansible.builtin.set_fact:
    gitlab_params: "{{ lookup('amazon.aws.aws_ssm', '/gitlab', bypath=true, region=aws_region, recursive=True, decrypt=True) }}"

- name: Parse params in to separate vars
  ansible.builtin.set_fact:
    domain_name: "{{ gitlab_params['/gitlab/domain_name'] }}"
    gitaly_token: "{{ gitlab_params['/gitlab/gitaly/gitaly_token'] }}"

- name: Configure gitlab.rb
  ansible.builtin.template:
    src: gitlab-gitaly.rb.j2
    dest: /etc/gitlab/gitlab.rb
    owner: root
    group: root
    mode: "0600"
  become: true

- name: Reconfigure GitLab
  ansible.builtin.command: gitlab-ctl reconfigure
  changed_when: true
  become: true

- name: Check GitLab Rake
  ansible.builtin.command: gitlab-rake gitlab:check
  changed_when: false
  register: gitlab_rake_check
  become: true

- name: Print Gitlab Rake Check
  ansible.builtin.debug:
    msg: "{{ gitlab_rake_check.stdout_lines }}"

- name: GitLab status
  ansible.builtin.command: gitlab-ctl status
  changed_when: false
  register: gitlab_status
  become: true

- name: Print Gitlab Status Check
  ansible.builtin.debug:
    msg: "{{ gitlab_status.stdout_lines }}"

- name: Restart Gitlab Gitaly
  ansible.builtin.command: gitlab-ctl restart gitaly
  changed_when: true
  become: true

