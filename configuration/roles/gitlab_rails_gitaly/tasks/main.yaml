- name: Build repositories storages config
  ansible.builtin.set_fact:
    rendered_content: "{{ lookup('template', 'gitlab-gitaly-connect.rb.j2') }}"

- name: Configure repositories storages in gitlab.rb
  ansible.builtin.blockinfile:
    path: /etc/gitlab/gitlab.rb
    append_newline: true
    prepend_newline: true
    block: "{{ rendered_content }}"
  become: true

- name: Reconfigure GitLab
  ansible.builtin.command: gitlab-ctl reconfigure
  changed_when: true
  become: true

- name: Check GitLab Rake
  ansible.builtin.command: gitlab-rake gitlab:check
  changed_when: false
  register: gitlab_rake_check
  become: true

- name: Print Gitlab Rake Check
  ansible.builtin.debug:
    msg: "{{ gitlab_rake_check.stdout_lines }}"

- name: GitLab status
  ansible.builtin.command: gitlab-ctl status
  changed_when: false
  register: gitlab_status
  become: true

- name: Print Gitlab Status Check
  ansible.builtin.debug:
    msg: "{{ gitlab_status.stdout_lines }}"
